<div class="profile-container">
    <div class="profile-header">
        <h2>Profile Settings</h2>
        <button class="button-9 blue" (click)="goBack()">Back to Game</button>
    </div>

    <div *ngIf="loading" class="loading-spinner">
        Loading profile data...
    </div>

    <form *ngIf="!loading" [formGroup]="profileForm" (ngSubmit)="save()">
        <div class="form-grid">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" formControlName="username" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="email">Email (Immutable)</label>
                <input id="email" type="email" formControlName="email">
            </div>

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input id="first_name" type="text" formControlName="first_name" placeholder="First Name">
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input id="last_name" type="text" formControlName="last_name" placeholder="Last Name">
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input id="country" type="text" formControlName="country" placeholder="e.g. USA, UK">
            </div>

            <div class="form-group">
                <label for="language">Language Preference</label>
                <select id="language" formControlName="language">
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="ru">Russian</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="avatar_url">Avatar URL</label>
                <input id="avatar_url" type="text" formControlName="avatar_url"
                    placeholder="https://example.com/avatar.png">
            </div>

            <div class="form-group full-width">
                <label for="bio">Bio</label>
                <textarea id="bio" formControlName="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
            </div>
        </div>

        <div *ngIf="message"
            [ngClass]="{'message': true, 'success': !message.includes('Failed'), 'error': message.includes('Failed')}">
            {{ message }}
        </div>

        <div class="actions">
            <button type="submit" class="button-9 green" [disabled]="profileForm.invalid || saving">
                {{ saving ? 'Saving...' : 'Save Changes' }}
            </button>
        </div>
    </form>
</div>
